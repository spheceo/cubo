[package]
name = "cubo-player"
version.workspace = true
edition.workspace = true
description = "Cubo Player: native playback of a Cubo Core source (macOS first)"
license = "MIT"

[[bin]]
name = "cubo-player"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", default-features = false, features = ["json"] }
winit = "0.30"
wgpu = "24"
pollster = "1"
cpal = "0.18"
ringbuf = "0.4"
crossbeam-channel = "0.5"
bytemuck = { version = "1", features = ["derive"] }
urlencoding.workspace = true
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventManager", "NSAppleEventDescriptor", "NSString", "NSObject"] }
