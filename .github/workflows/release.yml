name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$REPO" --title "Cubo $TAG" --generate-notes

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build the embedded web app
        run: bun install && bun --filter @cubo/web build
      - uses: actions/upload-artifact@v4
        with:
          name: cubo-web-dist
          path: apps/web/dist

  # Headless CLI (`cubo serve`). Ships as a plain tarball with the ffmpeg
  # sidecars bundled next to the binary — curl-installed files never carry a
  # browser quarantine marker, so unsigned distribution just works.
  cli:
    needs: [prepare, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # GitHub's free arm64 runner for public repos — native build, no
          # cross toolchain needed.
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Fetch ffmpeg sidecar binaries
        run: node scripts/fetch-ffmpeg.mjs --target ${{ matrix.target }}

      - uses: actions/download-artifact@v4
        with:
          name: cubo-web-dist
          path: apps/web/dist

      - name: Build CLI
        run: cargo build --release -p cubo-cli --target ${{ matrix.target }}

      - name: Package CLI (unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          stage="staging"
          mkdir "$stage"
          cp "target/${TARGET}/release/cubo-cli" "$stage/cubo"
          cp "scripts/binaries/ffmpeg-${TARGET}" "$stage/ffmpeg"
          cp "scripts/binaries/ffprobe-${TARGET}" "$stage/ffprobe"
          tar czf "cubo-cli-${TARGET}.tar.gz" -C "$stage" .
          sha256sum "cubo-cli-${TARGET}.tar.gz" > "cubo-cli-${TARGET}.tar.gz.sha256"
          gh release upload "$TAG" --repo "$REPO" --clobber \
            "cubo-cli-${TARGET}.tar.gz" "cubo-cli-${TARGET}.tar.gz.sha256"

      - name: Package CLI (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item "target/${env:TARGET}/release/cubo-cli.exe" staging/cubo.exe
          Copy-Item "scripts/binaries/ffmpeg-${env:TARGET}.exe" staging/ffmpeg.exe
          Copy-Item "scripts/binaries/ffprobe-${env:TARGET}.exe" staging/ffprobe.exe
          tar czf "cubo-cli-${env:TARGET}.tar.gz" -C staging .
          $hash = (Get-FileHash "cubo-cli-${env:TARGET}.tar.gz" -Algorithm SHA256).Hash.ToLower()
          "$hash  cubo-cli-${env:TARGET}.tar.gz" | Out-File -Encoding ascii "cubo-cli-${env:TARGET}.tar.gz.sha256"
          gh release upload "$env:TAG" --repo "$env:REPO" --clobber `
            "cubo-cli-${env:TARGET}.tar.gz" "cubo-cli-${env:TARGET}.tar.gz.sha256"
